<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
  <title id="title">Буфер глибини визначає, які частини монстра видно</title>
  <desc id="desc">Для кожної колонки екрана відстань до стіни порівнюється з відстанню до монстра. Центральні смуги, де стіна ближче, не малюються.</desc>
  <defs>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#182230}.title{font-size:22px;font-weight:700}.label{font-size:15px}.small{font-size:13px}</style>
  </defs>
  <rect width="840" height="420" rx="16" fill="#f7f9fc"/>
  <text x="28" y="38" class="title">4. Буфер глибини обрізає спрайт за стіною</text>
  <text x="34" y="82" class="label">Колонка екрана</text>
  <text x="34" y="127" class="label">Відстань до стіни</text>
  <text x="34" y="172" class="label">До монстра</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#182230" text-anchor="middle">
    <text x="275" y="82">1</text><text x="345" y="82">2</text><text x="415" y="82">3</text><text x="485" y="82">4</text><text x="555" y="82">5</text><text x="625" y="82">6</text><text x="695" y="82">7</text>
  </g>
  <g>
    <rect x="245" y="96" width="60" height="38" fill="#dbeafe" stroke="#93c5fd"/><rect x="315" y="96" width="60" height="38" fill="#dbeafe" stroke="#93c5fd"/><rect x="385" y="96" width="60" height="38" fill="#fecaca" stroke="#fca5a5"/><rect x="455" y="96" width="60" height="38" fill="#fecaca" stroke="#fca5a5"/><rect x="525" y="96" width="60" height="38" fill="#fecaca" stroke="#fca5a5"/><rect x="595" y="96" width="60" height="38" fill="#dbeafe" stroke="#93c5fd"/><rect x="665" y="96" width="60" height="38" fill="#dbeafe" stroke="#93c5fd"/>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#182230"><text x="275" y="121">5</text><text x="345" y="121">5</text><text x="415" y="121">2</text><text x="485" y="121">2</text><text x="555" y="121">2</text><text x="625" y="121">5</text><text x="695" y="121">5</text></g>
    <path d="M245 142H375" stroke="#15803d" stroke-width="5"/><path d="M385 142H585" stroke="#dc2626" stroke-width="5"/><path d="M595 142H725" stroke="#15803d" stroke-width="5"/>
  </g>
  <g>
    <path d="M245 180H725" stroke="#334155" stroke-width="2"/>
    <g fill="#cbd5e1" stroke="#94a3b8"><rect x="245" y="190" width="60" height="70"/><rect x="315" y="190" width="60" height="70"/><rect x="385" y="190" width="60" height="70"/><rect x="455" y="190" width="60" height="70"/><rect x="525" y="190" width="60" height="70"/><rect x="595" y="190" width="60" height="70"/><rect x="665" y="190" width="60" height="70"/></g>
    <g fill="#dc2626"><rect x="260" y="202" width="30" height="46"/><rect x="330" y="202" width="30" height="46"/><rect x="610" y="202" width="30" height="46"/><rect x="680" y="202" width="30" height="46"/></g>
    <g fill="#64748b"><rect x="400" y="190" width="30" height="70"/><rect x="470" y="190" width="30" height="70"/><rect x="540" y="190" width="30" height="70"/></g>
  </g>
  <text x="246" y="288" class="small">зелене — стіна далі за монстра, тому смугу видно</text>
  <text x="246" y="310" class="small">червоне/сіре — стіна ближче, відповідну смугу монстра приховано</text>
  <rect x="44" y="337" width="752" height="52" rx="8" fill="#e2e8f0"/>
  <text x="62" y="360" class="label">Правило для кожної смуги:</text>
  <text x="62" y="381" class="small">якщо transformY монстра ≥ depthBuffer[x], перед ним є стіна — не малювати цей стовпчик спрайта.</text>
</svg>
